name: Self-documenting PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull-request number from this repository
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.repo.full_name')
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Forked PRs must receive a patch artifact; this write-capable workflow stops.'; exit 1; }
          echo "head_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')" >> "$GITHUB_OUTPUT"

  preflight:
    needs: validate-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pr.outputs.head_ref }}
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: 'any::testthat, any::curl, any::callr' }
      - name: Application preflight
        run: |
          R CMD INSTALL .
          Rscript -e 'testthat::test_local()'
          Rscript scripts/shiny_smoke.R

  document:
    needs: [validate-pr, preflight]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pr.outputs.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: 'any::rcmdcheck, any::roxygen2, any::testthat, any::curl, any::callr' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request allowed documentation edits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          gh pr diff "$pr" > "$RUNNER_TEMP/pr.diff"
          python scripts/document_pr_agent.py --repository "$GITHUB_REPOSITORY" --pr-number "$pr" --policy .github/agents/documentation-policy.yml --diff "$RUNNER_TEMP/pr.diff" --output "$RUNNER_TEMP/documentation.patch"
          test ! -s "$RUNNER_TEMP/documentation.patch" || git apply --whitespace=error "$RUNNER_TEMP/documentation.patch"
      - name: Enforce documentation allow-list
        run: |
          changed=$(git diff --name-only)
          unexpected=$(echo "$changed" | grep -Ev '^(R/|man/|tests/testthat/|README.md$|NEWS.md$|USER_GUIDE.md$|WORKFLOW_INVENTORY.md$|docs/playwright/(manifest.yml|artifacts/))' || true)
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: Post-agent documentation checks
        run: |
          git diff --binary -- R man NAMESPACE > "$RUNNER_TEMP/before-roxygen.diff"
          Rscript -e 'roxygen2::roxygenise()'
          git diff --binary -- R man NAMESPACE > "$RUNNER_TEMP/after-roxygen.diff"
          diff -u "$RUNNER_TEMP/before-roxygen.diff" "$RUNNER_TEMP/after-roxygen.diff"
          Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")'
          Rscript scripts/check_docs.R
          Rscript scripts/update_workflow_inventory.R
          Rscript scripts/shiny_smoke.R
      - name: Commit reviewed documentation changes
        run: |
          git config user.name 'indiana-bird-tracker-docs[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R man tests/testthat README.md NEWS.md USER_GUIDE.md WORKFLOW_INVENTORY.md docs/playwright
          git diff --cached --quiet || git commit -m 'docs: update self-documenting PR artifacts'
          git push origin "HEAD:${{ needs.validate-pr.outputs.head_ref }}"
