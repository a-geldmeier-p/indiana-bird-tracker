name: Self-documenting PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull-request number from this repository
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.repo.full_name')
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Forked PRs cannot use this write-capable workflow.'; exit 1; }
          echo "head_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')" >> "$GITHUB_OUTPUT"

  preflight:
    needs: validate-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pr.outputs.head_ref }}
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: repo
          extra-packages: 'any::testthat, any::curl, any::callr'
      - name: Application preflight
        run: |
          R CMD INSTALL .
          Rscript -e 'testthat::test_local()'
          Rscript scripts/shiny_smoke.R

  document:
    needs: [validate-pr, preflight]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pr.outputs.head_ref }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: repo
          extra-packages: 'any::rcmdcheck, any::roxygen2, any::testthat, any::curl, any::callr'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install MCP and workflow tooling
        run: python -m pip install --disable-pip-version-check -r requirements-mcp.txt

      # The documentation agent runs first so its workflow-contract diff controls
      # which tutorials are new, changed, unchanged, or missing artifacts.
      - name: Request allowed documentation edits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || inputs.pr_number }}"
          gh pr diff "$pr" > "$RUNNER_TEMP/pr.diff"
          python scripts/document_pr_agent.py --repository "$GITHUB_REPOSITORY" --pr-number "$pr" --policy .github/agents/documentation-policy.yml --diff "$RUNNER_TEMP/pr.diff" --output "$RUNNER_TEMP/documentation.patch"
          test ! -s "$RUNNER_TEMP/documentation.patch" || git apply --whitespace=fix "$RUNNER_TEMP/documentation.patch"
          python scripts/sync_workflow_placeholders.py

      - name: Enforce documentation allow-list
        run: |
          changed=$(git diff --name-only)
          unexpected=$(echo "$changed" | grep -Ev '^(R/|man/|tests/testthat/|README.md$|NEWS.md$|USER_GUIDE.md$|WORKFLOW_INVENTORY.md$|\.github/agents/workflow-contract.yml$|docs/playwright/(manifest.yml|artifacts/))' || true)
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - name: Validate agent changes
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --check
          git diff --exit-code -- NAMESPACE
          Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")'
          Rscript scripts/update_workflow_inventory.R
          Rscript scripts/check_docs.R
          Rscript scripts/shiny_smoke.R

      - name: Select new or stale tutorials
        id: tutorials
        shell: bash
        run: |
          python scripts/check_tutorial_workflows.py
          python scripts/select_tutorial_workflows.py --output "$RUNNER_TEMP/tutorial-selection.json"
          count=$(python -c 'import json,os; print(len(json.load(open(os.environ["RUNNER_TEMP"] + "/tutorial-selection.json"))["workflows"]))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count tutorial workflow(s)."

      - name: Seed demo data and start Shiny
        if: steps.tutorials.outputs.count != '0'
        shell: bash
        run: |
          R CMD INSTALL .
          mkdir -p "$RUNNER_TEMP/bird-tracker/photos" "$RUNNER_TEMP/bird-tracker/reference-photos"
          Rscript scripts/seed_playwright_demo.R \
            "$RUNNER_TEMP/bird-tracker/bird_tracker.duckdb" \
            "$RUNNER_TEMP/bird-tracker/photos" \
            --serve \
            "$RUNNER_TEMP/bird-tracker/reference-photos" \
            > "$RUNNER_TEMP/shiny-playwright.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/shiny-playwright.pid"

      - name: Wait for tutorial Shiny app
        if: steps.tutorials.outputs.count != '0'
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3838 > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/shiny-playwright.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/shiny-playwright.log"; exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/shiny-playwright.log"
          exit 1

      - name: Start isolated Playwright MCP server
        if: steps.tutorials.outputs.count != '0'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-output"
          chmod 0777 "$RUNNER_TEMP/mcp-output"
          docker run --detach --rm --init --pull always \
            --name bird-tracker-playwright-mcp \
            --network host \
            --volume "$RUNNER_TEMP/mcp-output:/output" \
            --workdir /output \
            --entrypoint node \
            mcr.microsoft.com/playwright/mcp \
            /app/cli.js \
              --headless --browser chromium --caps devtools --no-sandbox --isolated \
              --host 0.0.0.0 --port 8931 --output-dir /output \
              --allowed-hosts 127.0.0.1:8931 \
              --allowed-origins http://127.0.0.1:3838
          for attempt in {1..30}; do
            docker inspect --format '{{.State.Running}}' bird-tracker-playwright-mcp 2>/dev/null | grep -qx true && exit 0
            sleep 1
          done
          docker logs bird-tracker-playwright-mcp || true
          exit 1

      - name: Record selected tutorials through Playwright MCP
        if: steps.tutorials.outputs.count != '0'
        shell: bash
        run: |
          python scripts/record_tutorials_mcp.py \
            --mcp-url http://127.0.0.1:8931/mcp \
            --base-url http://127.0.0.1:3838 \
            --selection "$RUNNER_TEMP/tutorial-selection.json" \
            --output-dir "$RUNNER_TEMP/mcp-output"

      - name: Publish selected MCP tutorials
        if: steps.tutorials.outputs.count != '0'
        shell: bash
        run: |
          python scripts/publish_playwright_videos.py \
            --source-dir "$RUNNER_TEMP/mcp-output" \
            --selection "$RUNNER_TEMP/tutorial-selection.json" \
            --commit-sha "$(git rev-parse HEAD)"
          python scripts/sync_workflow_placeholders.py
          Rscript scripts/check_docs.R

      - name: Commit reviewed documentation changes
        run: |
          git config user.name 'indiana-bird-tracker-docs[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R man tests/testthat README.md NEWS.md USER_GUIDE.md WORKFLOW_INVENTORY.md .github/agents/workflow-contract.yml docs/playwright
          git diff --cached --quiet || git commit -m 'docs: update self-documenting PR artifacts'
          git push origin "HEAD:${{ needs.validate-pr.outputs.head_ref }}"

      - name: Collect Playwright MCP logs
        if: always()
        shell: bash
        run: |
          docker logs bird-tracker-playwright-mcp > "$RUNNER_TEMP/playwright-mcp.log" 2>&1 || true
          docker rm --force bird-tracker-playwright-mcp 2>/dev/null || true

      - name: Upload tutorial videos and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mcp-tutorial-videos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mcp-output/
            ${{ runner.temp }}/tutorial-selection.json
            ${{ runner.temp }}/shiny-playwright.log
            ${{ runner.temp }}/playwright-mcp.log
          if-no-files-found: ignore
          retention-days: 30
