name: Deploy user guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - USER_GUIDE.md
      - docs/**
      - scripts/build_pages.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the Pages source from USER_GUIDE.md
        run: bash scripts/build_pages.sh
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
