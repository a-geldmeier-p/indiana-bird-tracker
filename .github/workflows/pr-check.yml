name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: 'any::rcmdcheck, any::roxygen2, any::testthat, any::curl, any::callr' }
      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")'
      - name: Tests
        run: Rscript -e 'testthat::test_local()'
      - name: Roxygen is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code -- R man NAMESPACE
      - name: Shiny smoke check with temporary data
        run: |
          R CMD INSTALL .
          Rscript scripts/shiny_smoke.R
      - name: Documentation contract
        run: |
          Rscript scripts/check_docs.R
          Rscript scripts/update_workflow_inventory.R
