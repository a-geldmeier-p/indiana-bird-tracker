name: Pre-agent PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.4.3' }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { extra-packages: 'any::testthat, any::curl, any::callr' }
      - name: Tests
        run: Rscript -e 'testthat::test_local()'
      - name: Shiny smoke check with temporary data
        run: |
          R CMD INSTALL .
          Rscript scripts/shiny_smoke.R
