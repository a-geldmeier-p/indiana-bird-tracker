allowed_paths:
  - R/**
  - man/**
  - tests/testthat/**
  - README.md
  - NEWS.md
  - USER_GUIDE.md
  - WORKFLOW_INVENTORY.md
  - .github/agents/workflow-contract.yml
forbidden_paths:
  - DESCRIPTION
  - NAMESPACE
  - .github/workflows/**
pre_agent_checks:
  - testthat::test_local()
  - Shiny smoke check
post_agent_checks:
  - R CMD check
  - testthat::test_local()
  - roxygen2::roxygenise()
  - scripts/check_docs.R
never_merge: true
